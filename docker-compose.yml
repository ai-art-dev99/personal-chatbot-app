services:

  # ── Development (hot-reload) ──────────────────────────
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:7860}
    command: sh -c "npm install && npm run dev"

  # ── Production (nginx serving the build) ─────────────
  prod:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-https://parsa2025ai-mychatbot.hf.space}
    ports:
      - "3000:80"
    restart: unless-stopped